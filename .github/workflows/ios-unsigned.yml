name: iOS unsigned IPA

# Builds an UNSIGNED Readest .ipa for sideloading (Sideloadly / AltStore re-sign it
# with your own Apple ID). Minimum iOS is 15.0 on this branch.
on:
  workflow_dispatch:
  # Runs when this file changes; start the others by hand (Actions > Run workflow).
  push:
    branches: [ccr-03f565fc-tppj75]
    paths: ['.github/workflows/ios-unsigned.yml']

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Checkout submodules (skip the unrelated gstack one)
        run: |
          git config submodule.apps/readest-app/.claude/skills/gstack.update none
          git submodule update --init --recursive --depth 1 || git submodule update --init --recursive

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-ios
          cache: false

      - name: Install dependencies
        working-directory: apps/readest-app
        run: pnpm install --frozen-lockfile && pnpm setup-vendors

      # xcodebuild reads XCODE_XCCONFIG_FILE and applies it over every project
      # setting, which switches code signing off without editing the project.
      - name: Disable code signing
        run: |
          cat > "$RUNNER_TEMP/nosign.xcconfig" <<'EOF'
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          DEVELOPMENT_TEAM =
          PROVISIONING_PROFILE_SPECIFIER =
          EOF
          echo "XCODE_XCCONFIG_FILE=$RUNNER_TEMP/nosign.xcconfig" >> "$GITHUB_ENV"

      # Build against your own server instead of the default one. All three are
      # repository variables (Settings > Secrets and variables > Actions >
      # Variables); the anon key is public by design.
      # Name the build in the app (sign-in and profile screens), so a device's version is obvious.
      - name: Label the build
        run: echo "NEXT_PUBLIC_BUILD_LABEL=${GITHUB_SHA::7}, run ${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Point the app at a custom server
        if: ${{ vars.API_BASE_URL != '' }}
        run: |
          echo "NEXT_PUBLIC_API_BASE_URL=${{ vars.API_BASE_URL }}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ vars.SUPABASE_URL }}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}" >> "$GITHUB_ENV"

      # Only if the server is behind Cloudflare Access (e.g. Google sign-in on the whole
      # domain): a service token lets the app through. CF_ACCESS_CLIENT_ID is a variable,
      # CF_ACCESS_CLIENT_SECRET a secret. It is only sent to your own server's hosts.
      - name: Let the app through Cloudflare Access
        if: ${{ vars.CF_ACCESS_CLIENT_ID != '' }}
        env:
          CF_ID: ${{ vars.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          echo "NEXT_PUBLIC_CF_ACCESS_CLIENT_ID=$CF_ID" >> "$GITHUB_ENV"
          echo "::add-mask::$CF_SECRET"
          echo "NEXT_PUBLIC_CF_ACCESS_CLIENT_SECRET=$CF_SECRET" >> "$GITHUB_ENV"

      # src-tauri/gen is generated, and only some of its files are tracked: the
      # Info.plist, asset catalog and Swift sources come from `tauri ios init`,
      # which renders its template only into an empty folder. Start from nothing,
      # then restore the tracked files so the repo's extensions, entitlements and
      # project settings win, as the Android release job does.
      - name: Generate the iOS project files
        working-directory: apps/readest-app
        run: |
          brew install xcodegen
          rm -rf src-tauri/gen/apple
          pnpm tauri ios init --ci
          git checkout -- .
          # Write the app icon from the repo's own icon set, so it never depends on
          # what the init template put in the asset catalog.
          python3 - <<'PY'
          import json, os, shutil
          src = 'src-tauri/icons/ios'
          dst = 'src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset'
          shutil.rmtree(dst, ignore_errors=True)
          os.makedirs(dst)
          os.makedirs('src-tauri/gen/apple/Assets.xcassets', exist_ok=True)
          json.dump({'info': {'version': 1, 'author': 'xcode'}}, open('src-tauri/gen/apple/Assets.xcassets/Contents.json', 'w'))
          images = []
          def add(idiom, size, scale, name):
              shutil.copy(os.path.join(src, name), os.path.join(dst, name))
              images.append({'idiom': idiom, 'size': size, 'scale': scale, 'filename': name})
          for size, scale, name in [('20x20','2x','AppIcon-20x20@2x.png'),('20x20','3x','AppIcon-20x20@3x.png'),('29x29','2x','AppIcon-29x29@2x.png'),('29x29','3x','AppIcon-29x29@3x.png'),('40x40','2x','AppIcon-40x40@2x.png'),('40x40','3x','AppIcon-40x40@3x.png'),('60x60','2x','AppIcon-60x60@2x.png'),('60x60','3x','AppIcon-60x60@3x.png')]:
              add('iphone', size, scale, name)
          for size, scale, name in [('20x20','1x','AppIcon-20x20@1x.png'),('20x20','2x','AppIcon-20x20@2x-1.png'),('29x29','1x','AppIcon-29x29@1x.png'),('29x29','2x','AppIcon-29x29@2x-1.png'),('40x40','1x','AppIcon-40x40@1x.png'),('40x40','2x','AppIcon-40x40@2x-1.png'),('76x76','1x','AppIcon-76x76@1x.png'),('76x76','2x','AppIcon-76x76@2x.png'),('83.5x83.5','2x','AppIcon-83.5x83.5@2x.png')]:
              add('ipad', size, scale, name)
          add('ios-marketing', '1024x1024', '1x', 'AppIcon-512@2x.png')
          json.dump({'images': images, 'info': {'version': 1, 'author': 'xcode'}}, open(os.path.join(dst, 'Contents.json'), 'w'), indent=2)
          print('app icon files:', len(images))
          PY
          # Regenerate from the repo's own project.yml: that is what writes the
          # widget's Info.plist (declared there, not tracked).
          (cd src-tauri/gen/apple && xcodegen generate)
          ls src-tauri/gen/apple/Readest_iOS src-tauri/gen/apple/ReadestWidget

      # The project hard-codes a signing team on each target, which outranks any
      # xcconfig override, so switch signing off in the project itself (the app,
      # the share extension and the widget). Sideloadly re-signs the result.
      - name: Turn off code signing in the project
        working-directory: apps/readest-app/src-tauri/gen/apple
        run: |
          sed -i '' \
            -e 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = ""; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;/' \
            -e 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/' \
            -e 's/DevelopmentTeam = [A-Z0-9]*;/DevelopmentTeam = "";/' \
            Readest.xcodeproj/project.pbxproj
          grep -c 'CODE_SIGNING_ALLOWED = NO' Readest.xcodeproj/project.pbxproj

      - name: Build iOS app
        working-directory: apps/readest-app
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        # Archive is produced before Tauri tries to export a signed IPA, and that
        # export is expected to fail without a signing identity.
        run: pnpm tauri ios build --ci || echo "tauri export step failed (expected without signing)"

      - name: Package unsigned IPA
        run: |
          APP=$(find apps/readest-app/src-tauri/gen/apple -type d -name 'Readest.app' -path '*Products/Applications*' | head -1)
          if [ -z "$APP" ]; then
            APP=$(find apps/readest-app/src-tauri/gen/apple -type d -name 'Readest.app' | head -1)
          fi
          echo "App bundle: $APP"
          test -n "$APP"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../Readest-unsigned.ipa Payload)
          ls -lh Readest-unsigned.ipa
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "ipa/Payload/Readest.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "ipa/Payload/Readest.app/Info.plist"

      - uses: actions/upload-artifact@v4
        with:
          name: Readest-unsigned-ipa
          path: Readest-unsigned.ipa
          if-no-files-found: error
